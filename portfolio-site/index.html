<!DOCTYPE html>
  <html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="bito-portrait-site">
  <link rel="icon" href="img/logo.webp">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  
  <title>微糖</title>

  <!-- フォントの指定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kiwi+Maru&family=Poppins:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- CSSの設定 -->
  <link href="css/ress.css" media="all" rel="stylesheet" type="text/css" />
  <link href="css/style.css" media="all" rel="stylesheet" type="text/css" />
</head>
  <body>
<!-- 全体の箱をwrapperとする -->
  <div class="wrapper">

    <!-- header -->
    <header class="header">
      <div class="container">
        <h1 class="header-logo">
          <a href="index.html"><img src="img/logo.webp" alt="ホームへ戻る"></a>
        </h1>
        <nav class="gnav">
          <ul class="gnav-list">
            <li class="gnav-item"><a href="index.html">HOME</a></li>
            <li class="gnav-item"><a href="gallery.html">Gallery</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- /header -->

     <!-- main -->
    <main class="content">
      <!-- mv -->
      <div class="mv">
        <div class="mv-container">
          <img src="img/mv.webp" alt="メイン画像">
          <p class="mv-text">To be, and not to be.</p>
        </div>
      </div>
      <!-- /mv -->
    </main>


<!-- gallery section -->
      <section class="gallery section">
        <div class="container">
          <!-- 中央配置テキスト -->
          <p class="gallery-lead">散歩や旅をしながら気ままに写真を撮っています</p>
        </div>
<!-- カルーセル（横スクロール）エリア -->
        <div class="carousel-wrapper">
          
          <!-- 1組目 -->
          <ul class="carousel-list">
            
            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#artwork"><img src="img/photo01.webp" alt="作品1"></a>
              </div>
              <p class="carousel-title">Artwork</p>
            </li>

            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#portrait"><img src="img/photo02.webp" alt="作品2"></a>
              </div>
              <p class="carousel-title">Portrait</p>
            </li>

            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#ceremony-Event"><img src="img/photo03.webp" alt="作品3"></a>
              </div>
              <p class="carousel-title">Ceremony / Event</p>
            </li>

            <li class="carousel-item">
              <div class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#snap"><img src="img/photo04.webp" alt="作品4"></a>
              </div>
              <p class="carousel-title">Snap</p>
            </li>

          </ul>

          <!-- 2組目（1組目と全く同じ内容をリピート用に追加） -->
          <ul class="carousel-list" aria-hidden="true">
            
            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#artwork"><img src="img/photo01.webp" alt="作品1" decoding="async"></a>
              </div>
              <p class="carousel-title">Artwork</p>
            </li>

            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#portrait"><img src="img/photo02.webp" alt="作品2" decoding="async"></a>
              </div>
              <p class="carousel-title">Portrait</p>
            </li>

            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#ceremony / Event"><img src="img/photo03.webp" alt="作品3" decoding="async"></a>
              </div>
              <p class="carousel-title">Ceremony / Event</p>
            </li>

            <li class="carousel-item">
              <div class="carousel-img">
                <a href="gallery.html#snap"><img src="img/photo04.webp" alt="作品4" decoding="async"></a>
              </div>
              <p class="carousel-title">Snap</p>
            </li>

          </ul>

        </div>
      </section>
      <!-- /gallery section -->


    <!-- footer -->
    <footer class="footer">
      <div class="copyright">&copy;2026 bito.photo</div>
    </footer>
    <!-- /footer -->



  </body>
</html>
